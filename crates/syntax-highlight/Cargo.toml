[package]
name = "syntax-highlight"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[features]
default = ["terminal"]
# Highlighting itself, through syntect and its Oniguruma regex engine, which
# is C. Without it the crate holds only CommandColors, which the runtime
# library formats commands with, so the runtime builds for
# wasm32-unknown-unknown.
highlight = ["dep:syntect", "dep:once_cell"]
html = ["highlight", "dep:html-escape"]
terminal = ["highlight"]

[dependencies]
syntect = { version = "5.2", default-features = false, features = ["yaml-load", "parsing", "html", "default-themes", "default-syntaxes", "dump-load", "regex-onig"], optional = true }
once_cell = { version = "1.19", optional = true }
html-escape = { version = "0.2", optional = true }

[dev-dependencies]
